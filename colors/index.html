<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>A안 색 후보 · 예시 중개사 홈페이지</title>
<meta name="description" content="예시 중개사 홈페이지 정통 신뢰형(A)에 금색 대신 쓸 강조색 4가지를 실제 화면에 입혀 비교한 페이지.">
<meta property="og:type" content="website">
<meta property="og:title" content="예시 중개사 홈페이지 · A안 색 후보">
<meta property="og:description" content="금색 대신 쓸 강조색 4가지(하늘색·흰색/은색·청록·연보라)를 같은 화면에 입혀 비교했습니다.">
<meta property="og:image" content="https://kkwon91.github.io/budong-sample-demo/colors/img/sky.jpg">
<meta property="og:url" content="https://kkwon91.github.io/budong-sample-demo/colors/">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* A안 색 후보 비교(공유용) — 2026-10-20 빌드 화면에 A :root 색 토큰만 덮어써서 찍은 캡처 */
:root{--bg:#F4F6FA;--card:#FFFFFF;--fg:#14213D;--ink:#3A4356;--muted:#5D6678;--line:#DDE3EC;--rec:#2B6CD0;--rec-bg:#E6F0FF;--old-bg:#EEF0F3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1522;--card:#182033;--fg:#E8EDF7;--ink:#C3CCDB;--muted:#9AA5B8;--line:#2A3550;--rec:#8CC4FF;--rec-bg:#1D2E4D;--old-bg:#222A3B;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
.w{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:28px 48px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--rec);text-decoration:none}
.back:hover{text-decoration:underline}
.k{font-size:13px;letter-spacing:.02em;color:var(--muted);font-weight:700;margin:18px 0 0}
h1{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.02em;margin:6px 0 8px;text-wrap:balance}
.lead{color:var(--ink);margin:0;max-width:62em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:28px}
.card{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.rec{border:2px solid var(--rec)}
.card img{display:block;width:100%;height:auto;max-width:100%;border-bottom:1px solid var(--line)}
.card.old{background:var(--old-bg);grid-column:1/-1;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:center}
.card.old img{border-bottom:0;border-right:1px solid var(--line)}
figcaption{padding:16px 18px 18px;display:grid;gap:10px}
.h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.h b{font-size:18px;font-weight:800}
.tag{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--old-bg);color:var(--muted)}
.rec .tag{background:var(--rec-bg);color:var(--rec)}
.sw{display:flex;flex-wrap:wrap;gap:6px 14px;list-style:none;margin:0;padding:0}
.sw li{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sw i{width:18px;height:18px;border-radius:5px;border:1px solid var(--line);display:inline-block}
.sw code{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
figcaption p{margin:0;color:var(--ink);font-size:14.5px}
.foot{margin-top:22px;font-size:13px;color:var(--muted)}
.foot a{color:inherit}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}.card.old{grid-template-columns:minmax(0,1fr)}.card.old img{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<main class="w">
  <a class="back" href="../">← 예시 홈페이지(디자인 3종) 보기</a>
  <p class="k">예시 중개사 홈페이지 · 정통 신뢰형(A)</p>
  <h1>금색 대신 쓸 강조색 4가지</h1>
  <p class="lead">같은 화면에 색만 바꿔 입혔습니다(위: 첫 화면, 아래: 약속 칸). 제목 둘째 줄·버튼·아이콘·밑줄이 함께 바뀌고, 금색과 짝을 이루던 베이지 바탕도 푸른 회색으로 바꿨습니다. ① 하늘색을 추천해 예시 홈페이지에 반영해 두었습니다.</p>
  <div class="grid">
    <figure class="card rec">
      <img src="img/sky.jpg" width="720" height="698" alt="정통 신뢰형(A) 홈 첫 화면과 약속 칸에 하늘색 강조색을 입힌 모습">
      <figcaption><div class="h"><b>① 하늘색</b><span class="tag">추천 · 지금 반영됨</span></div><ul class="sw" aria-label="쓰인 색"><li><i style="background:#8CC4FF"></i><code>#8CC4FF</code></li><li><i style="background:#1F5FBF"></i><code>#1F5FBF</code></li><li><i style="background:#0E2340"></i><code>#0E2340</code></li></ul><p>사진 속 하늘과 이어져 가장 자연스럽습니다. 은행·금융처럼 믿음직한 인상이고, 흰 바탕 글자는 진한 파랑으로 바꿔 잘 읽힙니다.</p></figcaption>
    </figure>
    <figure class="card">
      <img src="img/mono.jpg" width="720" height="698" alt="정통 신뢰형(A) 홈 첫 화면과 약속 칸에 흰색·은색 강조색을 입힌 모습" loading="lazy">
      <figcaption><div class="h"><b>② 흰색·은색</b><span class="tag">가장 차분함</span></div><ul class="sw" aria-label="쓰인 색"><li><i style="background:#C9D6EA"></i><code>#C9D6EA</code></li><li><i style="background:#FFFFFF"></i><code>#FFFFFF</code></li><li><i style="background:#0E2340"></i><code>#0E2340</code></li></ul><p>색을 거의 쓰지 않아 가장 정통적입니다. 버튼은 흰색, 제목 둘째 줄은 은빛 파랑. 대신 조금 밋밋해 보일 수 있습니다.</p></figcaption>
    </figure>
    <figure class="card">
      <img src="img/teal.jpg" width="720" height="698" alt="정통 신뢰형(A) 홈 첫 화면과 약속 칸에 청록 강조색을 입힌 모습" loading="lazy">
      <figcaption><div class="h"><b>③ 청록</b><span class="tag">산뜻함</span></div><ul class="sw" aria-label="쓰인 색"><li><i style="background:#5ED3DC"></i><code>#5ED3DC</code></li><li><i style="background:#0B7680"></i><code>#0B7680</code></li><li><i style="background:#0E2340"></i><code>#0E2340</code></li></ul><p>선명하고 산뜻합니다. 젊고 새로운 느낌이 강해서 ‘정통’과는 거리가 조금 있습니다.</p></figcaption>
    </figure>
    <figure class="card">
      <img src="img/peri.jpg" width="720" height="698" alt="정통 신뢰형(A) 홈 첫 화면과 약속 칸에 연보라 강조색을 입힌 모습" loading="lazy">
      <figcaption><div class="h"><b>④ 연보라</b><span class="tag">눈에 띔</span></div><ul class="sw" aria-label="쓰인 색"><li><i style="background:#AEB6FF"></i><code>#AEB6FF</code></li><li><i style="background:#4049B8"></i><code>#4049B8</code></li><li><i style="background:#0E2340"></i><code>#0E2340</code></li></ul><p>흔하지 않아 기억에 남습니다. 다만 부동산 중개에는 다소 가벼워 보일 수 있습니다.</p></figcaption>
    </figure>
    <figure class="card old">
      <img src="img/gold.jpg" width="720" height="698" alt="바꾸기 전 금색 강조색의 정통 신뢰형(A) 홈 첫 화면과 약속 칸" loading="lazy">
      <figcaption><div class="h"><b>지금까지 · 금색</b><span class="tag">바꾸기 전</span></div><ul class="sw" aria-label="쓰인 색"><li><i style="background:#E2C27D"></i><code>#E2C27D</code></li><li><i style="background:#7D5F22"></i><code>#7D5F22</code></li><li><i style="background:#0E2340"></i><code>#0E2340</code></li></ul><p>누르스름해 보이던 색입니다. 비교용으로 남겨 둡니다.</p></figcaption>
    </figure>
  </div>
  <p class="foot">화면: 2026-10-20 빌드 · 가상의 중개소 · <a href="../">예시 홈페이지 디자인 3종 + 관리자 화면</a></p>
</main>
</body>
</html>
